# ---------------------------------------------------------------------------
# Huniverse · QA & Network Engineering Notes
# Jekyll + Minimal Mistakes
# ---------------------------------------------------------------------------

# 테마 (air: 밝고 깔끔한 기본 톤 — 색/타이포는 assets/css/main.scss에서 조정)
minimal_mistakes_skin    : "air"

# 사이트 기본 정보
locale                   : "ko-KR"
rtl                      : # true, false (default)
title                    : "Huniverse"
title_separator          : "|"
subtitle                 : "QA & Network Engineering"
name                     : "Seok Hun"
description              : "QA 자동화·테스트 전략·네트워크 전반을 기록하는 기술 블로그"
url                      : "https://seokhun2.github.io"
# 사용자 페이지(SeokHun2.github.io) 저장소이므로 루트 URL(https://seokhun2.github.io/)에서 서비스됩니다.
baseurl                  : ""
repository               : "SeokHun2/SeokHun2.github.io"
teaser                   : # path of fallback teaser image, e.g. "/assets/images/500x300.png"
logo                     : "/assets/images/shlogo.png"
masthead_title           : # overrides the website title displayed in the masthead
breadcrumbs              : true
words_per_minute         : 200
date_format              : "%Y.%m.%d"
enable_copy_code_button  : true
copyright                : "Huniverse"
copyright_url            : "https://seokhun2.github.io"

comments:
  provider               : "disqus" # false (default), "disqus", "discourse", "facebook", "staticman", "staticman_v2", "utterances", "giscus", "custom"
  disqus:
    shortname            : "seokhun"
  discourse:
    server               :
  facebook:
    appid                :
    num_posts            :
    colorscheme          :
  utterances:
    theme                :
    issue_term           :
  giscus:
    repo_id              :
    category_name        :
    category_id          :
    discussion_term      :
    reactions_enabled    :
    theme                :
    strict               :
    input_position       :
    emit_metadata        :
    lang                 :
    lazy                 :
  staticman:
    branch               :
    endpoint             :

reCaptcha:
  siteKey                :
  secret                 :

atom_feed:
  path                   : # blank (default) uses feed.xml
  hide                   : # true, false (default)

# 검색 (Lunr — GitHub Pages에서 추가 플러그인 없이 동작)
search                   : true
search_full_content      : true
search_provider          : "lunr"
lunr:
  search_within_pages    : true

# SEO
google_site_verification :
bing_site_verification   :
naver_site_verification  : 3083d8597bb7b612aec045d6cd67bfdb4068bcf6
yandex_site_verification :
baidu_site_verification  :

# SNS 공유/메타
twitter:
  username               :
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :
social:
  type                   : Person
  name                   :
  links: # An array of links to social media profiles
    - "https://github.com/SeokHun2"

# Analytics
analytics:
  provider               : "google-gtag"
  google:
    tracking_id          : "G-PZ96581PGH"
    anonymize_ip         : false

# 작성자 정보
author:
  name             : "Seok Hun"
  avatar           : "/images/profileScene.jpg"
  bio              : "QA · 네트워크 엔지니어링을 기록합니다"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/SeokHun2"
    - label: "Notion"
      icon: "fa-solid fa-n"
      url: "http://hun2.notion.site"
    - label: "Youtube"
      icon: "fa-brands fa-youtube"
      url: "https://youtube.com/channel/UCefvo-jzz86YXTLWRl0JDGA?si=jV2ndav6_ehJaZsF"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://www.instagram.com/skkhun.2"

# 푸터
footer:
  links:
    - label: "GitHub"
      icon: "fa-brands fa-fw fa-github"
      url: "https://github.com/SeokHun2"
    - label: "Notion"
      icon: "fa-solid fa-fw fa-n"
      url: "http://hun2.notion.site"
    - label: "YouTube"
      icon: "fa-brands fa-fw fa-youtube"
      url: "https://youtube.com/channel/UCefvo-jzz86YXTLWRl0JDGA"

# 파일 처리
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - .travis.yml
  - /docs # Minimal Mistakes 테마 문서 원본
  - /test # Minimal Mistakes 테스트 사이트
  - screenshot.png
  - screenshot-layouts.png
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# 마크다운 변환
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 2..4
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

sass:
  sass_dir: _sass
  style: compressed

# 출력 & URL
# /:categories/:title/ — QA 글이면 /QA/글제목/, Network 글이면 /Network/글제목/
permalink: /:categories/:title/
timezone: Asia/Seoul

# 페이지네이션 (jekyll-paginate)
paginate: 8
paginate_path: "/page:num/"

# 플러그인 (GitHub Pages 허용 목록)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# 아카이브
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML 압축
compress_html:
  clippings: all
  ignore:
    envs: development

# 기본값
defaults:
  # 글
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      toc: true
      toc_sticky: true
      toc_label: "목차"
      read_time: true
      comments: true
      share: false
      related: true
      show_date: true
  # 페이지
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
